<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Founders | Premium Personal Brand</title>
    <meta name="description" content="R&S SERVICES - premium digital strategy and product engineering for ambitious brands." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="bg-[#050816] text-white">
    <div id="root"></div>
    <script>
      // Runtime error overlay and mount fallback for easier debugging
      window.addEventListener('error', function (e) {
        try {
          const overlay = document.createElement('div');
          overlay.style.position = 'fixed';
          overlay.style.left = '0';
          overlay.style.top = '0';
          overlay.style.right = '0';
          overlay.style.padding = '18px';
          overlay.style.background = 'rgba(200,40,40,0.95)';
          overlay.style.color = 'white';
          overlay.style.zIndex = '99999';
          overlay.style.fontFamily = 'sans-serif';
          overlay.textContent = 'Runtime error: ' + (e && e.message ? e.message : 'See console');
          document.body.appendChild(overlay);
        } catch (err) {
          // ignore
        }
      });


    </script>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
